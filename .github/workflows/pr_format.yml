name: PRFormat

# Auto-formats PRs from this repo (commits only if format changes files)
on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    # no fork PRs, which are only style checked and handled by pr_ci.yml
    # no db-edit PRs, which must hold only the data and generated files of their issue (adding lua formatting and other stuff would make changes harder to track)
    if: github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.event.pull_request.head.ref, 'db-edit/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Format and commit if changed
        uses: ./.github/actions/run-stylua
        with:
          mode: format

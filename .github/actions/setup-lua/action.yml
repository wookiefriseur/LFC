name: Setup Lua
description: Install Lua 5.1 for the library checks.
runs:
  using: composite
  steps:
    - shell: bash
      # Prevent bot from sleeping on the job again
      run: |
        APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
        sudo timeout 120 apt-get $APT update
        sudo timeout 120 apt-get $APT install -y lua5.1
        echo "LUA=/usr/bin/lua5.1" >> "$GITHUB_ENV"
        echo "LUAC=/usr/bin/luac5.1" >> "$GITHUB_ENV"

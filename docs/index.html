<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Furniture Catalogue</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

      "./ignored-items.js": "./ignored-items.js?v=2bafeeb1a80e",
      "./knowledge.js": "./knowledge.js?v=38a3c3f1887a",

</head>
<body>
  <header>
    <h1><a id="home-link" href="./" data-t-title="site.home.tip">Furniture Catalogue</a><small><time id="site-updated" hidden></time><a id="site-commit" hidden></a></small></h1>
    <!-- Tab bar - generated from masks.js -->
    <button id="nav-toggle" type="button" popovertarget="tab-bar" aria-expanded="false" data-t="site.menu"></button>
    <nav id="tab-bar" class="tabs" role="tablist"></nav>
  </header>

  <!-- Mask panels - one <main> per registered mask, generated by masks.js -->
  <div id="panel-host"></div>

  <footer>
    <span class="credit muted">
      <a href="https://esoitem.uesp.net/" target="_blank" rel="noopener noreferrer"
         data-t-title="site.credit.uesp" data-t-aria-label="site.credit.uesp">
        <img class="credit-icon" src="./assets/sites/uesp.png" alt="" width="16" height="16">
      </a>
      <a href="https://creativecommons.org/licenses/by-sa/2.5/" target="_blank" rel="noopener noreferrer"
         data-t-title="site.credit.licence" data-t-aria-label="site.credit.licence">
        <svg class="credit-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <circle cx="8" cy="8" r="6.8" fill="none" stroke="currentColor" stroke-width="1.4"/>
          <path fill="currentColor" d="M6.6 6.6a2 2 0 1 0 0 2.8l-.9-.6a1 1 0 1 1 0-1.6l.9-.6Zm4 0a2 2 0 1 0 0 2.8l-.9-.6a1 1 0 1 1 0-1.6l.9-.6Z"/>
        </svg>
      </a>
    </span>
    <button id="settings-open" type="button" class="btn-mini footer-control" data-t-title="site.settings.tip" data-t-aria-label="site.settings">
      <span class="ico ico-settings" aria-hidden="true"></span><span class="pick-text" data-t="site.settings"></span></button>
    <label class="theme-pick muted">
      <select id="language-select" data-t-aria-label="site.language" data-t-title="site.language.tip"></select>
    </label>
    <label class="theme-pick muted"><span class="pick-glyph ico ico-paintbrush" aria-hidden="true"></span><span class="pick-text" data-t="site.theme"></span>
      <select id="theme-select" data-t-aria-label="site.theme.label">
        <option value="system" data-t="site.theme.system"></option>
        <option value="light" data-t="site.theme.light"></option>
        <option value="dark" data-t="site.theme.dark"></option>
      </select>
    </label>
    <span id="status" class="muted"></span>
    <span class="footer-actions">
      <span id="pending-count"></span>
      <span id="pending-restore" class="muted" role="status"></span>
      <button id="btn-submit" class="btn-primary" hidden data-t="send.open"></button>
    </span>
  </footer>

  <dialog id="settings" class="settings-dialog" aria-labelledby="settings-title">
    <button type="button" class="modal-close" data-t-aria-label="common.close">×</button>
    <h2 id="settings-title" data-t="settings.title"></h2>
    <section class="settings-section">
      <h3 data-t="settings.trade"></h3>
      <p class="muted" data-t="trade.intro"></p>
      <fieldset>
        <legend><img class="site-icon" src="./assets/sites/esohub.png" alt="" width="16" height="16"> ESO-Hub
          <button type="button" class="help-toggle" aria-expanded="false" aria-controls="help-esohub" data-t-title="trade.help" data-t-aria-label="trade.help"><span class="ico ico-circle-help" aria-hidden="true"></span></button></legend>
        <p id="help-esohub" class="settings-help muted" data-t="trade.esohub.help" hidden></p>
        <label><input type="checkbox" name="trade-site" value="esohub"> <span data-t="trade.show"></span></label>
      </fieldset>
      <fieldset>
        <legend><img class="site-icon" src="./assets/sites/ttc.png" alt="" width="16" height="16"> Tamriel Trade Centre
          <button type="button" class="help-toggle" aria-expanded="false" aria-controls="help-ttc" data-t-title="trade.help" data-t-aria-label="trade.help"><span class="ico ico-circle-help" aria-hidden="true"></span></button></legend>
        <p id="help-ttc" class="settings-help muted" data-t="trade.ttc.help" hidden></p>
        <label><input type="checkbox" name="trade-site" value="ttc"> <span data-t="trade.show"></span></label>
        <div class="settings-row">
          <label><span data-t="trade.ttc.server"></span>
            <select id="ttc-server"><option value="eu">EU</option><option value="us">NA</option></select></label>
          <label><span data-t="trade.ttc.platform"></span>
            <select id="ttc-platform"><option value="pc">PC</option><option value="xb">Xbox</option><option value="ps">PlayStation</option></select></label>
        </div>
      </fieldset>
    </section>
  </dialog>

  <div id="modal" class="modal" role="dialog" aria-labelledby="modal-title">
    <div class="modal-inner">
      <button id="modal-close" class="modal-close" data-t-aria-label="common.close">×</button>
      <div class="modal-head">
        <img class="modal-scribe" src="./assets/scribe.png" alt=""
             width="72" height="72" loading="lazy">
        <div class="modal-head-text">
          <h2 id="modal-title" data-t="send.title"></h2>
          <p id="modal-summary" class="muted"></p>
        </div>
      </div>
      <div id="modal-validation"></div>
      <div id="modal-changelist" class="modal-changelist"></div>
      <div id="modal-parts"></div>
      <div id="modal-single-actions" class="modal-actions">
        <a id="modal-open-issue" class="btn-primary" target="_blank" rel="noopener"></a>
        <button id="modal-copy"></button>
      </div>
      <div id="modal-oversize" class="modal-oversize" role="alert" hidden>
        <p data-t="send.oversize"><strong data-hole="lead" data-t="send.oversize.lead"></strong></p>
        <ol>
          <li><button id="modal-oversize-copy" class="btn-primary"></button>
            <span data-t="send.oversize.copy_hint"></span></li>
          <li><a id="modal-oversize-open" class="btn-primary" target="_blank" rel="noopener" data-t="send.oversize.open"></a>
            <span data-t="send.oversize.open_hint"></span></li>
        </ol>
      </div>
      <div class="modal-reset">
        <button id="modal-edit-changes" data-t="send.edit"></button>
        <button id="modal-discard" class="btn-danger" data-t="send.discard"></button>
        <span id="modal-discard-ask" class="modal-discard-ask" hidden>
          <span id="modal-discard-question"></span>
          <button id="modal-discard-yes" class="btn-danger" data-t="send.discard.yes"></button>
          <button id="modal-discard-no" data-t="send.discard.no"></button>
        </span>
      </div>
      <p class="modal-no-github muted" data-t="send.no_github"><a data-hole="forums" href="https://www.esoui.com/downloads/info4804-LibFurnitureCatalogue.html#comments"
           target="_blank" rel="noopener noreferrer" data-t="send.no_github.forums"></a></p>
      <details id="modal-technical" class="modal-technical">
        <summary data-t="send.raw"></summary>
        <textarea id="modal-diff" readonly rows="12"></textarea>
      </details>
    </div>
  </div>

  <script type="module" src="./app.js?v=b96512e511de"></script>
</body>
</html>

<body>
  <header>
    <h1>Furniture Catalogue</h1>
    <!-- Tab bar - generated from masks.js -->
    <nav id="tab-bar" class="tabs" role="tablist"></nav>
  </header>

  <!-- Mask panels - one <main> per registered mask, generated by masks.js -->
  <div id="panel-host"></div>

  <footer>
    <span class="credit muted">
      <a href="https://esoitem.uesp.net/" target="_blank" rel="noopener noreferrer"
         title="Item pages and icons via UESP" aria-label="Item pages and icons via UESP">
        <svg class="credit-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M7.4 3.6C6.3 2.9 4.9 2.6 3.2 2.6c-.4 0-.7.3-.7.7v8.3c0 .4.3.7.7.7 1.5 0 2.8.3 3.8.9.2.1.4 0 .4-.2V3.8a.3.3 0 0 0-.1-.2Zm1.2 0C9.7 2.9 11.1 2.6 12.8 2.6c.4 0 .7.3.7.7v8.3c0 .4-.3.7-.7.7-1.5 0-2.8.3-3.8.9-.2.1-.4 0-.4-.2V3.8c0-.1 0-.2.1-.2Z"/>
        </svg>
      </a>
      <a href="https://creativecommons.org/licenses/by-sa/2.5/" target="_blank" rel="noopener noreferrer"
         title="Content licensed CC BY-SA 2.5" aria-label="Content licensed CC BY-SA 2.5">
        <svg class="credit-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <circle cx="8" cy="8" r="6.8" fill="none" stroke="currentColor" stroke-width="1.4"/>
          <path fill="currentColor" d="M6.6 6.6a2 2 0 1 0 0 2.8l-.9-.6a1 1 0 1 1 0-1.6l.9-.6Zm4 0a2 2 0 1 0 0 2.8l-.9-.6a1 1 0 1 1 0-1.6l.9-.6Z"/>
        </svg>
      </a>
    </span>
    <span id="status" class="muted"></span>
    <span class="footer-actions">
      <span id="pending-count">Nothing to send yet.</span>
      <button id="btn-submit" class="btn-primary" hidden>Send it -&gt;</button>
    </span>
  </footer>

  <div id="modal" class="modal" role="dialog" aria-labelledby="modal-title">
    <div class="modal-inner">
      <button id="modal-close" class="modal-close" aria-label="close">×</button>
      <div class="modal-head">
        <img class="modal-scribe" src="./assets/scribe.png" alt=""
             width="72" height="72" loading="lazy">
        <div class="modal-head-text">
          <h2 id="modal-title">Send your changes</h2>
          <p id="modal-summary" class="muted"></p>
        </div>
      </div>
      <p id="modal-validation"></p>
      <div id="modal-changelist" class="modal-changelist"></div>
      <div class="modal-actions">
        <a id="modal-open-issue" class="btn-primary" target="_blank" rel="noopener">Send using GitHub</a>
        <button id="modal-copy">Copy to clipboard</button>
      </div>
      <div class="modal-reset">
        <button id="modal-edit-changes">Edit changes</button>
        <button id="modal-discard" class="btn-danger">Start over - discard these changes</button>
        <span id="modal-discard-ask" class="modal-discard-ask" hidden>
          <span id="modal-discard-question"></span>
          <button id="modal-discard-yes" class="btn-danger">Discard them</button>
          <button id="modal-discard-no">Keep them</button>
        </span>
      </div>
      <p id="modal-url-note" class="muted" hidden>Too many changes for one link: copy them and paste into a new issue</p>
      <p class="modal-no-github muted">No GitHub account? Paste this on the
        <a href="https://www.esoui.com/downloads/info4804-LibFurnitureCatalogue.html#comments"
           target="_blank" rel="noopener noreferrer">ESOUI forums</a> instead</p>
      <details id="modal-technical" class="modal-technical">
        <summary>Raw data</summary>
        <textarea id="modal-diff" readonly rows="12"></textarea>
      </details>
    </div>
  </div>

  <script type="module" src="./app.js?v=1eb32bb0e1da"></script>
</body>
</html>

          <circle cx="8" cy="8" r="6.8" fill="none" stroke="currentColor" stroke-width="1.4"/>

    </label>
    <label class="theme-pick muted"><span data-t="site.theme"></span>
      <select id="theme-select" data-t-aria-label="site.theme.label">
        <option value="system" data-t="site.theme.system"></option>
        <option value="light" data-t="site.theme.light"></option>
        <option value="dark" data-t="site.theme.dark"></option>
      </select>
    </label>
    <span id="status" class="muted"></span>
    <span class="footer-actions">
      <span id="pending-count"></span>
      <span id="pending-restore" class="muted" role="status"></span>
      <button id="btn-submit" class="btn-primary" hidden data-t="send.open"></button>
    </span>
  </footer>

  <div id="modal" class="modal" role="dialog" aria-labelledby="modal-title">
    <div class="modal-inner">
      <button id="modal-close" class="modal-close" data-t-aria-label="common.close">×</button>
      <div class="modal-head">
        <img class="modal-scribe" src="./assets/scribe.png" alt=""
             width="72" height="72" loading="lazy">
        <div class="modal-head-text">
          <h2 id="modal-title" data-t="send.title"></h2>
          <p id="modal-summary" class="muted"></p>
        </div>
      </div>
      <div id="modal-validation"></div>
      <div id="modal-changelist" class="modal-changelist"></div>
      <div id="modal-parts"></div>
      <div id="modal-single-actions" class="modal-actions">
        <a id="modal-open-issue" class="btn-primary" target="_blank" rel="noopener"></a>
        <button id="modal-copy"></button>
      </div>
      <div id="modal-oversize" class="modal-oversize" role="alert" hidden>
        <p data-t="send.oversize"><strong data-hole="lead" data-t="send.oversize.lead"></strong></p>
        <ol>
          <li><button id="modal-oversize-copy" class="btn-primary"></button>
            <span data-t="send.oversize.copy_hint"></span></li>
          <li><a id="modal-oversize-open" class="btn-primary" target="_blank" rel="noopener" data-t="send.oversize.open"></a>
            <span data-t="send.oversize.open_hint"></span></li>
        </ol>
      </div>
      <div class="modal-reset">
        <button id="modal-edit-changes" data-t="send.edit"></button>
        <button id="modal-discard" class="btn-danger" data-t="send.discard"></button>
        <span id="modal-discard-ask" class="modal-discard-ask" hidden>
          <span id="modal-discard-question"></span>
          <button id="modal-discard-yes" class="btn-danger" data-t="send.discard.yes"></button>
          <button id="modal-discard-no" data-t="send.discard.no"></button>
        </span>
      </div>
      <p class="modal-no-github muted" data-t="send.no_github"><a data-hole="forums" href="https://www.esoui.com/downloads/info4804-LibFurnitureCatalogue.html#comments"
           target="_blank" rel="noopener noreferrer" data-t="send.no_github.forums"></a></p>
      <details id="modal-technical" class="modal-technical">
        <summary data-t="send.raw"></summary>
        <textarea id="modal-diff" readonly rows="12"></textarea>
      </details>
    </div>
  </div>

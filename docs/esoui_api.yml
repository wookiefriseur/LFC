openapi: "3.2.0"
info:
  title: "ESOUI AddOns API"
  version: "1.0.0"
  description: Info from [ESOUI Forums](https://www.esoui.com/forums/showpost.php?p=28513&postcount=1)
servers:
  - url: https://api.esoui.com/addons

security:
  - ApiToken: []
  - ForumCookie: []

components:
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: x-api-token
    ForumCookie:
      type: apiKey
      in: cookie
      name: bbsessionhash

  responses:
    "202":
      description: "Update Accepted."
    "401":
      description: "Permission Denied. You are not the author or team member of this AddOn"
    "403":
      description: "AddOn Disabled: Request is missig credentials or an admin has disabled your AddOn!"
    "404":
      description: "No AddOns found. (You don't have any AddOns) or ID(s) are missing for AddOn details"
    "405":
      description: "Missing required data fields for AddOn Update (See actual error message for a list of fields)"
    "415":
      description: " File type not supported (You have tried to upload a file other than a zip/rar)"
    "500":
      description: "File update failed (Contact an admin, something bad happened)"
  schemas:
    UpdateBody:
      type: object
      properties:
        id:
          description: "ID number of your AddOn you wish to update."
          type: "integer"
        title:
          description: "Title or name of your AddOn."
          type: "string"
        version:
          description: "Version number of your AddOn. *Must change this number if new file is included."
          type: "string"
        description:
          description: "Full description of your AddOn."
          type: "string"
        changelog:
          description: "Full changelog of your AddOn."
          type: "string"
        archive:
          description: "Default/Blank = Archive previous, Yes = Archive previous, No = Do not archive previous"
          type: "string"
        compatible:
          description: "Comma delimited list of all patch numbers your AddOn is compatiable with."
          type: "string"
        updatefile:
          description: "AddOn Zip or Rar file."
          type: "string"
          contentMediaType: "application/octet-stream"
      required:
        - id
    AddOnInfo:
      type: "object"
      properties:
        id:
          type: "string"
          examples: ["4804"]
        title:
          type: "string"
          examples: ["LibFurnitureCatalogue"]
        filename:
          description: "filename of zip archive"
          type: "string"
          examples: ["LibFurnitureCatalogue-1.0.0.zip"]
        version:
          type: "string"
          examples: ["1.0.0"]
        updated:
          type: "string"
          examples: ["1678719846"]
        created:
          type: "string"
          examples: ["1487548838"]
        description:
          type: "string"
          examples: ["some text"]
        changelog:
          type: "string"
          examples: ["some more text"]
        compatibility:
          examples:
            - ["12.1.0", "12.0.0", "11.3.0", "11.2.0"]
          type: "array"
          items:
            type: "string"
        update:
          type: "string"
          examples: ["https://api.esoui.com/addons/update"]

paths:
  /update:
    get:
      summary: "Get required fields for Upload"
      responses:
        "200":
          description: "Returns a description of UpdateBody expected by POST"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  allOf:
                    - type: "object"
                      properties:
                        ERROR:
                          type: "string"
                          examples: ["Please POST the following data for AddOn Updates.."]
                    - $ref: "#/components/schemas/UpdateBody"
        "403":
          $ref: "#/components/responses/403"
    post:
      summary: "Update AddOn"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UpdateBody"
      responses:
        "202":
          $ref: "#/components/responses/202"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "405":
          $ref: "#/components/responses/405"
        "415":
          $ref: "#/components/responses/415"

  /updatetest:
    post:
      summary: "Update AddOn, simulated"
      description: >
        Same as /update, but nothing is published.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UpdateBody"
      responses:
        "202":
          description: >
            Update Accepted. Body is "invalid" JSON: a compatibility list and the
            real response concatenated, like [{...}]{...}.
          $ref: "#/components/responses/202"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "405":
          $ref: "#/components/responses/405"
        "415":
          $ref: "#/components/responses/415"

  /compatible.json:
    get:
      summary: "Get compatible versions"
      description: >
        Lists compatible game versions.
      responses:
        "403":
          $ref: "#/components/responses/403"
        "200":
          description: "Successful operation"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  type: "object"
                  properties:
                    id:
                      type: "string"
                    name:
                      type: "string"
                    interface:
                      type: "string"
                    default:
                      type: "boolean"
              example:
                - id: "9.0.0"
                  name: "Necrom"
                  interface: "101038"
                  default: true
                - id: "1.2.3"
                  name: "SomeOtherName"
                  interface: "100123"
                  default: false

  /details/{ADDON_ID}.json:
    get:
      summary: "Get AddOn details"
      description: >
        Get version and other AddOn infos.
      parameters:
        - in: path
          name: ADDON_ID
          schema:
            type: string
          required: true
          description: The id of the AddOn
      responses:
        "200":
          description: "Successful operation"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/AddOnInfo"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"

  /list.json:
    get:
      summary: "Get AddOns you have access to"
      responses:
        "403":
          $ref: "#/components/responses/403"
        "200":
          description: "Successful operation"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  type: "object"
                  properties:
                    id:
                      type: "string"
                    title:
                      type: "string"
                    details:
                      type: "string"
                  examples:
                    - id: "4804"
                      title: "LibFurnitureCatalogue"
                      details: "https://api.esoui.com/addons/details/4804.json"
